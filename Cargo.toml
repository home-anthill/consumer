[package]
name = "ks89-consumer"
version = "5.0.0"
edition = "2024"
resolver = "3"

[[bin]]
name = "consumer"
path = "src/main.rs"

[lib]
name = "consumer"
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[dependencies]
lapin = { version = "4.12.3" }
tokio = { version = "^1.54.0", features = ["full"] }
mongodb = "^3.9.1"
redis = { version = "^1.7.1", features = ["tokio-comp", "connection-manager", "aio", "ahash", "r2d2"] }
futures-lite = "^2.6.1"
uuid = { version = "1.28.0" }
hmac = "^0.13.0"
sha2 = "^0.11.1"
hex = "^0.4.3"
base64 = "^0.23.1"
aes-gcm = "0.11.1"
urlencoding = "^2.1.3"
# error handling
thiserror = "2.0.21"
anyhow = "^1.0.104"
# logger
tracing = "^0.1.44"
tracing-appender = "^0.2.5"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
# env vars
dotenvy = "^0.15.7"
envy = "^0.4.2"

# To use Serialize and Deserialize traits, you must include Serde.
# The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"

[dev-dependencies]
rand = "^0.10.3"
uuid = { version = "^1.28.0", features = ["v4", "fast-rng"] }
# better looking rust assertions
pretty_assertions = "^1.4.1"
# include also serde_json with the feature 'preserve_order' to don't change the order of keys
# 'preserve_order' is required to compare results in a predictible way in testing
serde_json = { version = "^1.0.154", features = ["preserve_order"] }
test-log = {version = "^0.2.21", features = ["trace"]}
